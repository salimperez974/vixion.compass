<style>
  :root {
    --navy: #00024F;
    --azure: #0574CE;
    --teal: #00A889;
    --sand: #F0E6D8;
    --sand-light: #FAF5ED;
    --grey: #555555;
    --grey-light: #999999;
    --grey-bg: #F5F5F5;
    --light-teal: #C2E5D5;
    --light-blue: #DCE6F1;
    --light-amber: #F4E4B8;
    --light-red: #F4D4D4;
    --white: #FFFFFF;
    --base-size: 16px;
    --shadow-sm: 0 2px 4px rgba(0,2,79,0.06);
    --shadow-md: 0 4px 12px rgba(0,2,79,0.1);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: var(--base-size);
    line-height: 1.5;
    color: #1a1a1a;
    background: var(--sand-light);

    padding: 0;

  }
  body.size-125 { --base-size: 18px; }
  body.size-150 { --base-size: 20px; }
  body.size-175 { --base-size: 22px; }
  .header { background: var(--white); box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 720px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-logo { width: 36px; height: 36px; background: var(--teal); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 0.9em; }

  .brand-name { font-weight: 700; color: var(--navy); font-size: 0.95em; }
  .brand-sub { color: var(--grey); font-size: 0.7em; letter-spacing: 0.05em; }
  .header-controls { display: flex; gap: 8px; align-items: center; }
  .control-btn { background: var(--grey-bg); border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 0.85em; font-weight: 600; color: var(--navy); transition: all 0.15s; }
  .control-btn:hover { background: var(--sand); }
  .control-btn:focus-visible { outline: 2px solid var(--azure); outline-offset: 2px; }
  .control-btn.active { background: var(--navy); color: white; }
  .progress-wrapper { max-width: 720px; margin: 0 auto; padding: 12px 20px 0; }
  .progress-info { display: flex; justify-content: space-between; font-size: 0.8em; color: var(--grey); margin-bottom: 8px; font-weight: 500; }
  .progress-bar { height: 6px; background: var(--grey-bg); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--azure)); transition: width 0.4s ease; border-radius: 3px; }
  .progress-message { margin-top: 8px; font-size: 0.85em; color: var(--teal); font-style: italic; font-weight: 500; min-height: 20px; }
  .main { max-width: 720px; margin: 0 auto; padding: 24px 20px 80px; }
  .welcome { text-align: center; padding: 24px 0; }
  .welcome h1 { color: var(--navy); font-size: 2em; margin-bottom: 12px; letter-spacing: -0.02em; }
  .welcome .compass-icon { width: 80px; height: 80px; margin: 0 auto 20px; background: linear-gradient(135deg, var(--teal), var(--azure)); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-md); }
  .welcome .compass-icon svg { width: 44px; height: 44px; fill: white; }
  .welcome-tagline { color: var(--teal); font-size: 1.1em; font-style: italic; margin-bottom: 24px; }
  .welcome-invitation { color: var(--navy); font-size: 1.05em; font-weight: 500; line-height: 1.5; margin: 28px auto 24px auto; max-width: 480px; text-align: center; padding: 0 12px; }

  .welcome-card.resume-card h3 { color: var(--azure); }

  .section-tag { display: inline-block; background: var(--sand); color: var(--navy); padding: 4px 12px; border-radius: 100px; font-size: 0.75em; font-weight: 600; letter-spacing: 0.05em; margin-bottom: 16px; text-transform: uppercase; }
  .question-text { color: var(--navy); font-size: 1.25em; line-height: 1.4; margin-bottom: 8px; font-weight: 600; }
  .question-helper { color: var(--grey); font-size: 0.9em; margin-bottom: 20px; font-style: italic; }

  .clinical-section { padding: 20px 24px; border-bottom: 1px solid #e5e7eb; }
  .clinical-section h4 { color: var(--navy); font-size: 0.95em; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
  .clinical-line { display: flex; margin-bottom: 8px; font-size: 0.92em; }

  }
  .hidden { display: none !important; }
</style>

<script>
// ============================================================
// VixiOn Compass v6.3 — corrección de nomenclatura + UI/UX
// ============================================================
// Cambios desde v6.2:
//   1. tierMap: 3 tiers (Esencial / Equilibrada / Completa)
//   2. tierScores: { esencial, equilibrada, completa } — fusionados activa+medida en equilibrada
//   3. Override forzado: queratocono → Equilibrada (decisión clínica firme)
//   4. tierMessageMap: mensaje de Equilibrada calibrado para Monofocal Plus + Apthera IC-8
//   5. Halo demo: SVG inline (reemplaza base64 JPEG)
//   6. Confirmation: agrupado por sección
//   7. ARIA labels para accesibilidad
//   8. Fix typo: "IC8" → "IC-8"
// ============================================================

let state = {
  currentScreen: 'welcome',
  currentQuestionIdx: 0,
  answers: {},
  lang: 'es',
  sizeLevel: 0,
  showClinical: false
};
const STORAGE_KEY = 'vixionCompass_progress_v1';

function saveProgress() {
  if (state.currentScreen === 'welcome') return;
  if (Object.keys(state.answers).length === 0) return;
  try {
    const snapshot = {
      currentScreen: state.currentScreen,
      currentQuestionIdx: state.currentQuestionIdx,
      answers: state.answers,
      lang: state.lang,
      savedAt: new Date().toISOString()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
    const indicator = document.getElementById('autosaveIndicator');
    const indicatorText = document.getElementById('autosaveText');
    if (indicator && indicatorText) {
      indicatorText.textContent = state.lang === 'es' ? '✓ Guardado automáticamente' : '✓ Auto-saved';
      indicator.style.display = 'block';
      indicator.style.opacity = '1';
      clearTimeout(window._autosaveTimer);
      window._autosaveTimer = setTimeout(() => { if (indicator) indicator.style.opacity = '0.5'; }, 1500);
    }
  } catch (e) { console.warn('Could not save progress:', e); }
}
function loadProgress() {
  try { const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return null; return JSON.parse(raw); }
  catch (e) { return null; }
}
function clearProgress() { try { localStorage.removeItem(STORAGE_KEY); } catch (e) {} }
function resumeFromSaved(saved) {
  state.currentScreen = saved.currentScreen;
  state.currentQuestionIdx = saved.currentQuestionIdx;
  state.answers = saved.answers || {};
  state.lang = saved.lang || 'es';
  document.getElementById('langBtn').textContent = state.lang === 'es' ? 'EN' : 'ES';
  document.documentElement.lang = state.lang;
  render();
}
function startFresh() {
  clearProgress();
  state.currentScreen = 'welcome';
  state.currentQuestionIdx = 0;
  state.answers = {};
  render();
}

// SVG inline halo demo (reemplaza base64 JPEG — más nítido, accesible, ~5KB → ~700 bytes)
const HALO_DEMO_SVG = `

  <text x="300" y="30" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="system-ui">Halo</text>

  <g transform="translate(100,110)">

      en: ['Office / professional / administrative work','Security forces (police, military, firefighter)','Manual work with facial trauma risk (construction, mechanical)','Professional driver (taxi, truck, ambulance)','Contact or high-impact athlete','Healthcare professional working with microscope','Educator, artist, other','Retired or not applicable']

const SECTIONS = {
  s1: { es: 'Su situación actual', en: 'Your current situation' },
  s2: { es: 'Su vida visual', en: 'Your visual life' },
  s3: { es: 'Sus preferencias y expectativas', en: 'Your preferences and expectations' },
  s4: { es: 'Información clínica', en: 'Clinical information' }
};

function getApplicableQuestions() {
  return QUESTIONS.filter(q => { if (q.condition && !q.condition(state.answers)) return false; return true; });
}

// ============================================================
// CALCULATEOUTPUT — v6.3 nomenclatura corregida
// ============================================================
function calculateOutput() {
  const a = state.answers;
  const result = {
    via: null, viaLabel: null, viaCode: null,
    tier: null, tierLabel: null,
    redFlags: [], yellowFlags: [], greenFlags: [],
    appliedRules: [], narrative: '',
    tierScores: { esencial: 0, equilibrada: 0, completa: 0 }
  };
  // === REGLAS DE VÍA CLÍNICA ===
  if (a.q2_reason === 0) {
    result.viaCode = 'D';
    result.via = 'Vía D — Cirugía de catarata premium';
    result.viaLabel = 'Cataract surgery with premium IOL';
    result.appliedRules.push('Regla 1: Catarata diagnosticada → Vía D');
    if (a.q3_correction === 7) result.appliedRules.push('Sub-regla: post-refractiva + catarata → recomendación específica de PureSee dentro de Vía D');
  } else if (Array.isArray(a.q3_1_magnitude) && a.q3_1_magnitude.includes(1) && (a.q1_age === 0 || a.q1_age === 1)) {
    result.viaCode = 'B';
    result.via = 'Vía B — Refractiva fáquica (EVO ICL)';
    result.viaLabel = 'Phakic refractive (EVO ICL)';
    result.appliedRules.push('Regla 2: Miopía moderada/alta + edad <50 → Vía B (ICL recomendado, evitar cirugía corneal)');
    if (a.q3_2_floaters === 2 || a.q3_2_floaters === 3) result.yellowFlags.push({ label: 'Posible PVD', detail: 'Miope <50 con flotadores nuevos frecuentes — evaluar PVD y considerar Vía C alternativa.' });
  } else if ((a.q1_age >= 2) && (a.q2_reason === 1 || a.q2_reason === 2 || a.q2_reason === 4)) {
    result.viaCode = 'C';
    result.via = 'Vía C — Lensectomía refractiva';
    result.viaLabel = 'Refractive lens exchange';
    result.appliedRules.push('Regla 3: Edad 50+ sin catarata + busca solución refractiva → Vía C (enfoque lenticular resuelve lejos y cerca)');
    if (a.q8_multifocal_interest === 0) result.appliedRules.push('Sub-regla: alto interés en multifocalidad → recomendación específica de Visión Completa');
  } else if (Array.isArray(a.q3_1_magnitude) && a.q3_1_magnitude.includes(2) && a.q1_age >= 1 && a.q7_glasses_reading >= 3) {
    result.viaCode = 'C';
    result.via = 'Vía C — Lensectomía refractiva';
    result.viaLabel = 'Refractive lens exchange';
    result.appliedRules.push('Regla 4: Hipermetropía + edad 45+ + alta motivación de independencia → Vía C con multifocalidad como alternativa');
  } else if ((a.q1_age === 0 || a.q1_age === 1) && (a.q2_reason === 1 || a.q2_reason === 4) && (!Array.isArray(a.q3_1_magnitude) || !a.q3_1_magnitude.includes(4))) {
    result.viaCode = 'A';
    result.via = 'Vía A — Refractiva corneal (Wavelight Plus)';
    result.viaLabel = 'Corneal refractive (Wavelight Plus)';
    result.appliedRules.push('Regla 5: Edad <50 + busca dejar espejuelos + sin presbicia dominante → Vía A (LASIK/PRK con Wavelight Plus)');
    if (Array.isArray(a.q14_conditions) && a.q14_conditions.includes(9)) result.yellowFlags.push({ label: 'Posible córnea limítrofe', detail: 'Auto-reporte de córnea delgada — evaluar Vía B (ICL) como alternativa si confirma en evaluación.' });
  } else if (a.q1_age === 1 && (a.q2_reason === 2 || (Array.isArray(a.q3_1_magnitude) && a.q3_1_magnitude.includes(4)))) {
    result.viaCode = 'E';
    result.via = 'Vía E — Tratamiento farmacológico (Vizz)';
    result.viaLabel = 'Pharmacological (Vizz drops)';
    result.appliedRules.push('Regla 6: Edad 40-49 con presbicia incipiente → Vía E como primera línea (gotas son efectivas en este grupo)');
    if (a.q13_reversibility === 3) result.appliedRules.push('Sub-regla: paciente prefiere solución definitiva → Vía A o C como segunda línea si gotas no funcionan');
  } else if (a.q2_reason === 5) {
    result.viaCode = 'EXP';
    result.via = 'Evaluación informativa — paciente explorando sin certeza de procedimiento';
    result.viaLabel = 'Informational evaluation';
    result.appliedRules.push('Regla 6.5: Paciente declara que está explorando sin haber decidido procedimiento — consulta debe ser informativa, no orientada a vender tier.');
  } else {
    result.viaCode = 'AMB';
    result.via = 'Evaluación clínica requerida — múltiples vías posibles';
    result.viaLabel = 'Clinical evaluation needed';
    result.appliedRules.push('Regla 7: Combinación no matchea regla específica — el cirujano evalúa con datos completos.');
  }

  // === SCORING DE TIERS — Esencial / Equilibrada / Completa ===
  const score = result.tierScores;
  if (Array.isArray(a.q4_activities)) {
    if (a.q4_activities.includes(11)) {
      score.completa += 4;
    } else {
      const numActivities = a.q4_activities.length;
      const hasDistance = a.q4_activities.includes(0) || a.q4_activities.includes(1);
      const hasIntermediate = a.q4_activities.includes(3) || a.q4_activities.includes(4);
      const hasNear = a.q4_activities.includes(2) || a.q4_activities.includes(9);
      if (numActivities >= 6 && hasDistance && hasIntermediate && hasNear) score.completa += 3;
      else if (hasDistance && hasIntermediate && !hasNear) score.equilibrada += 3;
      else if (hasNear && !hasDistance) score.esencial += 2;
    }
  }
  if (a.q6_night_driving === 3 || a.q6_night_driving === 4) { score.equilibrada += 3; score.esencial += 1; }
  if (a.q7_glasses_reading === 0 || a.q7_glasses_reading === 1) { score.esencial += 3; score.equilibrada += 1; }
  else if (a.q7_glasses_reading === 3 || a.q7_glasses_reading === 4) { score.completa += 3; }
  if (a.q8_multifocal_interest === 0) score.completa += 2;
  else if (a.q8_multifocal_interest === 3) score.esencial += 2;
  if (a.q9_halos === 0) score.completa += 4;
  else if (a.q9_halos === 2) { score.equilibrada += 3; score.esencial += 2; }
  if (a.q7_5_motivation !== undefined) {
    if (a.q7_5_motivation === 0) score.completa += 2;
    else if (a.q7_5_motivation === 1) {
      score.equilibrada += 2; score.esencial += 1;
      result.greenFlags.push({ label: 'Motivación de seguridad', detail: 'Paciente busca cirugía por razones de seguridad, no por molestia con espejuelos. No presionar por independencia total — la conversación clínica debe partir de respeto a su contexto.' });
    } else if (a.q7_5_motivation === 2) {
      score.equilibrada += 2;
      result.greenFlags.push({ label: 'Motivación profesional', detail: 'Cirugía considerada por razones laborales específicas — alinear conversación con uso profesional, no con independencia general.' });
    } else if (a.q7_5_motivation === 3) {
      score.equilibrada += 2;
      result.greenFlags.push({ label: 'Motivación deportiva', detail: 'Cirugía considerada para actividad deportiva — relevante: si profesión también de alto riesgo, considerar PRK.' });
    } else if (a.q7_5_motivation === 4) {
      score.equilibrada += 2; score.esencial += 1;
    }
  }
  if (a.q7_6_glasses_relationship !== undefined) {
    if (a.q7_6_glasses_relationship === 0) score.completa += 2;
    else if (a.q7_6_glasses_relationship === 3) {
      score.completa -= 3; score.equilibrada += 2; score.esencial += 2;
      result.greenFlags.push({ label: 'Espejuelos como identidad', detail: 'Paciente considera los espejuelos parte de su identidad o estilo. No presionar por independencia. Tier Esencial o Equilibrada con conversación honesta de que los espejuelos pueden seguir siendo parte de su vida postoperatoria es apropiado.' });
    } else if (a.q7_6_glasses_relationship === 4) score.equilibrada += 1;
    else if (a.q7_6_glasses_relationship === 6) {
      score.completa += 1; score.equilibrada += 2;
      result.greenFlags.push({ label: 'Intolerancia a lentes de contacto', detail: 'Paciente solo usaba lentes de contacto y ya no los tolera. Motivación clínica relevante para considerar opciones refractivas.' });
    } else if (a.q7_6_glasses_relationship === 8) {
      result.yellowFlags.push({ label: 'Post-cirugía refractiva previa', detail: 'Paciente ya no usa corrección debido a cirugía refractiva previa (LASIK, PRK, RK, Kamra, ICL). Considerar: (1) contexto biomecánico/topográfico para nueva intervención, (2) posibles cambios en cálculo de IOL si requiere catarata, (3) expectativas calibradas según resultado previo. Verificar tipo y año exacto de cirugía durante consulta.' });
    }
  }
  if (a.q3_3_contacts_occasional !== undefined) {
    if (a.q3_3_contacts_occasional === 3) {
      result.yellowFlags.push({ label: 'Uso frecuente de lentes de contacto', detail: 'Paciente alterna espejuelos y contactos la mayoría de los días — evaluar superficie ocular con atención al riesgo de ojo seco crónico subclínico antes de cualquier procedimiento premium.' });
      if (result.viaCode === 'B') result.appliedRules.push('Sub-regla: alta tolerancia demostrada a manipulación ocular (uso frecuente de contactos) — refuerza candidatura natural a ICL.');
    } else if (a.q3_3_contacts_occasional === 1) {
      if (result.viaCode === 'B') result.appliedRules.push('Sub-regla: uso ocasional de contactos reportado — tolerancia básica a manipulación ocular demostrada.');
      if (a.q7_5_motivation === 1 || a.q7_5_motivation === 3) result.appliedRules.push('Sub-regla: uso situacional de contactos coincide con motivación de seguridad/deportiva — la cirugía resolvería específicamente esos contextos donde los espejuelos son obstáculo.');
    } else if (a.q3_3_contacts_occasional === 2) {
      if (result.viaCode === 'B') result.appliedRules.push('Sub-regla: uso regular de contactos demostrado — buena tolerancia a manipulación ocular, candidato natural a ICL.');
      if (a.q7_5_motivation === 1 || a.q7_5_motivation === 3) result.appliedRules.push('Sub-regla: uso situacional de contactos coincide con motivación de seguridad/deportiva — la cirugía resolvería específicamente esos contextos donde los espejuelos son obstáculo.');
    } else if (a.q3_3_contacts_occasional === 4) {
      result.yellowFlags.push({ label: 'Intolerancia previa a lentes de contacto', detail: 'Paciente probó contactos sin tolerarlos. Si vía es B (ICL), conversación específica sobre que ICL no requiere manipulación postoperatoria continua — la intolerancia previa no contraindica ICL pero sí justifica explicación clara.' });
    }
  }
  if (a.q15_5_preformed === 2) {
    result.yellowFlags.push({ label: 'Preferencia preformada', detail: 'Paciente llega con interés específico en una opción. Validar que su preferencia coincide con criterio clínico apropiado. Si no coincide, conversación específica sobre por qué la opción que él prefiere puede no ser óptima para sus ojos.' });
  } else if (a.q15_5_preformed === 3) {
    result.appliedRules.push('Sub-regla: paciente declara que no está considerando cirugía — orientar consulta como informativa.');
  }

  // === BANDERAS POR CONDICIONES OCULARES ===
  let keratoconusForcedTier = false;
  if (Array.isArray(a.q14_conditions)) {
    const macularRed = a.q14_conditions.includes(2) || a.q14_conditions.includes(3) || a.q14_conditions.includes(4);
    if (macularRed) {
      score.completa = -10;
      result.redFlags.push({ label: 'Patología macular', detail: 'Visión Completa categóricamente excluida. Priorizar Equilibrada o Esencial. Workup macular específico antes de la cita.' });
    }
    if (a.q14_conditions.includes(5)) {
      // OVERRIDE FORZADO: queratocono = Apthera IC-8 = Equilibrada (decisión clínica firme)
      keratoconusForcedTier = true;
      score.equilibrada += 15; // peso fuerte para garantizar Equilibrada como max
      score.completa = -10;    // multifocales contraindicadas en córnea irregular
      result.redFlags.push({ label: 'Queratocono diagnosticado', detail: 'Evaluación específica para Apthera IC-8 (subopción dentro del tier Equilibrada). Pentacam y aberrometría preoperatorios. Override forzado: tier asignado a Equilibrada por anatomía corneal irregular.' });
      result.appliedRules.push('Override clínico: queratocono → tier Equilibrada (Apthera IC-8 como subopción). Multifocales corneales y trifocales contraindicadas.');
    }
    if (a.q14_conditions.includes(1)) result.yellowFlags.push({ label: 'Glaucoma diagnosticado', detail: 'Protocolo específico de glaucoma + premium. Evaluar MIGS concurrente cuando aplique.' });
    if (a.q14_conditions.includes(6)) result.yellowFlags.push({ label: 'Ojo seco crónico', detail: 'Protocolo OSD preoperatorio (ASCRS Algorithm 2026). Postergar cirugía premium hasta superficie estable.' });
  }
  if (Array.isArray(a.q14_5_meds)) {
    if (a.q14_5_meds.includes(0)) result.yellowFlags.push({ label: 'Tamsulosina (Flomax)', detail: 'Riesgo de IFIS intraoperatorio. Anticipar técnica con expansores iridianos en cirugía de catarata.' });
    if (a.q14_5_meds.includes(1)) result.yellowFlags.push({ label: 'Anticoagulación', detail: 'Coordinar con médico tratante para manejo perioperatorio.' });
    if (a.q14_5_meds.includes(2)) result.yellowFlags.push({ label: 'Diabetes', detail: 'Confirmar HbA1c reciente. HbA1c >7 sugiere diferir cirugía electiva hasta optimización.' });
  }
  if (a.q10_expectations === 0) {
    result.redFlags.push({ label: 'Expectativas inalcanzables', detail: 'Conversación específica de calibración de expectativas antes de cualquier discusión de tier premium.' });
    score.completa = -10; score.equilibrada -= 3; score.esencial += 3;
  }
  if (a.q12_recommendation === 2) {
    result.yellowFlags.push({ label: 'Prioriza prestigio sobre criterio clínico', detail: 'Conversación específica de criterios de selección clínica. Riesgo elevado de insatisfacción postoperatoria.' });
    score.completa -= 4; score.equilibrada += 1;
  }
  if (a.q11_family === 2) result.yellowFlags.push({ label: 'Familiar con outcome problemático', detail: 'Desconfianza preformada. Dedicar tiempo adicional en consulta — no apresurar decisión.' });
  if (a.q15_profession === 1 || a.q15_profession === 4) result.yellowFlags.push({ label: 'Profesión alto riesgo trauma facial', detail: 'Si vía es A (refractiva corneal), preferir PRK sobre LASIK por mejor perfil biomecánico.' });
  if (a.q15_profession === 3) {
    result.yellowFlags.push({ label: 'Conductor profesional', detail: 'Conducción nocturna profesional — minimización de halos es prioridad. Visión Equilibrada con Monofocales Plus es opción más segura que Visión Completa con multifocales.' });
    score.completa -= 4; score.equilibrada += 3;
  }
  if (Array.isArray(a.q14_5_meds) && a.q14_5_meds.includes(0) && result.viaCode === 'D') {
    score.completa -= 1;
    result.appliedRules.push('Sub-regla: tamsulosina + Vía D — IFIS aumenta riesgo de complicación intraoperatoria que puede comprometer outcome multifocal. Considerar tier más conservador.');
  }
  if (a.q13_reversibility === 0 && a.q1_age <= 1 && Array.isArray(a.q3_1_magnitude) && a.q3_1_magnitude.includes(4)) {
    result.appliedRules.push('Sub-regla: alta preferencia por reversibilidad → fortalece Vía E (gotas reversibles)');
  }
  if (result.viaCode === 'B' || result.viaCode === 'E') {
    score.completa = Math.min(score.completa, 0);
    result.appliedRules.push('Restricción anatómica: Vía ' + result.viaCode + ' no soporta multifocalidad — el tier funciona como nominal, no multifocal. Tier Completa excluida operativamente para este paciente.');
  }

  // === MAX TIER — 3 tiers asignables ===
  let maxTier = 'esencial';
  let maxScore = score.esencial;
  if (score.equilibrada > maxScore) { maxTier = 'equilibrada'; maxScore = score.equilibrada; }
  if (score.completa > maxScore) { maxTier = 'completa'; maxScore = score.completa; }

  // OVERRIDE: queratocono fuerza Equilibrada independiente del scoring
  if (keratoconusForcedTier) maxTier = 'equilibrada';

  const tierMap = { esencial: 'Visión Esencial', equilibrada: 'Visión Equilibrada', completa: 'Visión Completa' };
  result.tier = tierMap[maxTier];
  result.tierLabel = maxTier;

  // === BANDERAS VERDES POR PERFIL IDEAL ===
  if (maxTier === 'completa' && a.q9_halos === 0 && a.q7_glasses_reading >= 3 && a.q10_expectations === 1) {
    result.greenFlags.push({ label: 'Perfil ideal Visión Completa', detail: 'Convergencia de criterios — paciente alineado con tier Completa.' });
  }
  if (maxTier === 'equilibrada' && a.q9_halos === 2 && a.q6_night_driving >= 3) {
    result.greenFlags.push({ label: 'Perfil ideal Visión Equilibrada', detail: 'Conductor nocturno frecuente con preferencia por evitar halos — alineación clara con Equilibrada.' });
  }

  // NOTA: Visión Combinada (mix & match) NO es asignada por algoritmo — decisión clínica del cirujano post-evaluación

  result.narrative = generateNarrative(a, result);
  return result;
}

function generateNarrative(a, result) {
  const ageMap = ['menor de 40', '40-49', '50-59', '60-69', '70+'];
  const correctionMap = ['sin corrección actual', 'espejuelos solo para leer', 'espejuelos solo para distancia', 'espejuelos para todo (uso constante)', 'dos pares de espejuelos (lectura y distancia)', 'progresivos o bifocales', 'lentes de contacto', 'post-cirugía refractiva (LASIK/PRK/RK/Kamra/ICL)'];
  let narrative = 'Paciente de ' + ageMap[a.q1_age] + ' años, ' + (correctionMap[a.q3_correction] || 'corrección no especificada') + '. ';
  const reasonMap = ['catarata diagnosticada', 'busca dejar de usar espejuelos', 'dificultad para ver de cerca', 'visión borrosa o distorsionada', 'razones de seguridad/profesional/deportiva', 'explorando sin certeza de procedimiento', 'consulta de seguimiento'];
  narrative += 'Motivo de consulta: ' + reasonMap[a.q2_reason] + '. ';
  if (a.q7_6_glasses_relationship !== undefined) {
    const relMap = ['Considera espejuelos/contactos un fastidio que quiere eliminar','Los usa sin problema pero preferiría no necesitarlos','Los usa como parte neutral de su rutina','Los considera parte de su identidad o estilo','Los usa por necesidad pero quisiera depender menos','Solo usa lentes de contacto y los tolera bien','Solo usa lentes de contacto pero ya no los tolera como antes','No usa espejuelos ni lentes de contacto','No usa espejuelos ni lentes de contacto por cirugía refractiva previa (LASIK/PRK/RK/Kamra/ICL)'];
    narrative += 'Relación actual: ' + relMap[a.q7_6_glasses_relationship] + '. ';
  }
  if (Array.isArray(a.q4_activities) && a.q4_activities.length > 0) {
    if (a.q4_activities.includes(7)) narrative += 'Vida visual amplia con todas las actividades cotidianas relevantes. ';
    else if (a.q4_activities.length >= 5) narrative += 'Vida visual amplia con múltiples demandas. ';
    else if (a.q4_activities.length >= 3) narrative += 'Vida visual moderada. ';
    else narrative += 'Vida visual focalizada. ';
  }
  if (a.q6_night_driving === 3 || a.q6_night_driving === 4) narrative += 'Conduce de noche frecuentemente. ';
  if (a.q7_glasses_reading === 4) narrative += 'Hipotéticamente prioriza independencia total de espejuelos post-procedimiento. ';
  else if (a.q7_glasses_reading <= 1) narrative += 'Hipotéticamente toleraría usar espejuelos para tareas específicas post-procedimiento. ';
  if (a.q9_halos === 0) narrative += 'Hipotéticamente aceptaría halos suaves a cambio de independencia. ';
  else if (a.q9_halos === 2) narrative += 'Hipotéticamente prefiere no tener halos aunque mantenga espejuelos para lectura. ';
  if (a.q16_open && a.q16_open.trim().length > 0) narrative += 'Comentario abierto del paciente: "' + a.q16_open.substring(0, 200) + '".';
  return narrative;
}

function render() {
  const main = document.getElementById('main');
  const progressWrapper = document.getElementById('progressWrapper');
  if (state.currentScreen === 'welcome') { progressWrapper.style.display = 'none'; renderWelcome(); }
  else if (state.currentScreen === 'questions') { progressWrapper.style.display = 'block'; renderQuestion(); }
  else if (state.currentScreen === 'confirm') { progressWrapper.style.display = 'none'; renderConfirmation(); }
  else if (state.currentScreen === 'output') { progressWrapper.style.display = 'none'; renderOutput(); }
}

function renderWelcome() {
  const t = T[state.lang];
  const saved = loadProgress();
  const hasSaved = saved && Object.keys(saved.answers || {}).length > 0;
  let savedDate = '';
  if (hasSaved && saved.savedAt) {
    try { const d = new Date(saved.savedAt); savedDate = d.toLocaleDateString(state.lang === 'es' ? 'es-PR' : 'en-US', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) {}
  }
  const answeredCount = hasSaved ? Object.keys(saved.answers).length : 0;
  const resumeBlock = hasSaved ? `
    <div class="welcome-card resume-card">
      <h3>${state.lang === 'es' ? '¿Continuar donde lo dejó?' : 'Continue where you left off?'}</h3>
      <p style="margin-bottom:14px;">
        ${state.lang === 'es' ? `Tiene ${answeredCount} respuesta${answeredCount === 1 ? '' : 's'} guardada${answeredCount === 1 ? '' : 's'}${savedDate ? ' del ' + savedDate : ''}.` : `You have ${answeredCount} saved answer${answeredCount === 1 ? '' : 's'}${savedDate ? ' from ' + savedDate : ''}.`}
      </p>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-primary" style="flex:1; min-width:140px;" onclick='resumeFromSaved(${JSON.stringify(saved).replace(/'/g, "&#39;")})'>${state.lang === 'es' ? 'Continuar' : 'Continue'}</button>
        <button class="btn btn-secondary" style="flex:1; min-width:140px;" onclick="startFresh()">${state.lang === 'es' ? 'Empezar de nuevo' : 'Start fresh'}</button>
      </div>
    </div>` : '';
  document.getElementById('main').innerHTML = `
    <div class="welcome">
      <div class="compass-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2L8 8l4 14 4-14-4-6zm0 4l2 3-2 7-2-7 2-3z"/></svg>
      </div>
      <h1>${t.welcome_title}</h1>
      <p class="welcome-tagline">${t.welcome_subtitle}</p>
      ${resumeBlock}
      <p class="welcome-invitation">${t.welcome_invitation}</p>
      <div class="welcome-card">
        <h3>${t.welcome_intro_h}</h3>
        <p>${t.welcome_intro_p}</p>
      </div>
      <div class="welcome-card">
        <h3>${t.welcome_features_h}</h3>
        <ul class="welcome-bullets">${t.welcome_features.map(f => `<li>${f}</li>`).join('')}</ul>
      </div>
      ${!hasSaved ? `<button class="btn btn-primary" style="max-width:300px; margin: 16px auto 0; display:block;" onclick="startQuestionnaire()">${t.btn_start}</button>` : ''}
    </div>`;
}

function renderQuestion() {
  const t = T[state.lang];
  const applicableQs = getApplicableQuestions();
  const q = applicableQs[state.currentQuestionIdx];
  if (!q) { state.currentScreen = 'confirm'; render(); return; }
  const total = applicableQs.length;
  const current = state.currentQuestionIdx + 1;
  const progressPct = (current / total) * 100;
  const progressFill = document.getElementById('progressFill');
  progressFill.style.width = progressPct + '%';
  document.querySelector('.progress-bar').setAttribute('aria-valuenow', Math.round(progressPct));
  document.getElementById('progressLabel').textContent = t.progress_q + ' ' + current + ' ' + t.progress_of + ' ' + total;
  let remainingSeconds = 0;
  for (let i = state.currentQuestionIdx; i < total; i++) {
    const qq = applicableQs[i];
    const optsLen = qq.options ? (qq.options[state.lang] || []).length : 0;
    if (qq.type === 'multi') remainingSeconds += 50;
    else if (qq.type === 'text') remainingSeconds += 60;
    else if (qq.type === 'likert') remainingSeconds += 30;
    else if (qq.type === 'single_dynamic') remainingSeconds += 35;
    else if (qq.type === 'single' && optsLen >= 6) remainingSeconds += 40;
    else remainingSeconds += 25;
    if (qq.showHaloDemo) remainingSeconds += 15;
    if (qq.infoBlock) remainingSeconds += 10;
  }
  const remainingMin = Math.max(1, Math.round(remainingSeconds / 60));
  document.getElementById('progressTime').textContent = '~' + remainingMin + ' min';
  const msgEl = document.getElementById('progressMessage');
  if (current === Math.floor(total / 2)) msgEl.textContent = t.halfway;
  else if (current === total - 2) msgEl.textContent = t.near_done;
  else msgEl.textContent = '';
  const sectionLabel = SECTIONS[q.section][state.lang];
  const helperText = q.helper ? q.helper[state.lang] : '';
  const optionalLabel = q.optional ? `<span style="color:var(--grey-light); font-weight:normal;"> · ${t.optional}</span>` : '';
  let optionsHTML = '';
  if (q.type === 'single' || q.type === 'single_dynamic') {
    let opts;
    if (q.type === 'single_dynamic') opts = q.dynamicOptions(state.answers) || [];
    else opts = q.options[state.lang];
    const selected = state.answers[q.id];
    optionsHTML = '<div class="options" role="radiogroup">' + opts.map((opt, i) => `
        <button class="option ${selected === i ? 'selected' : ''}" role="radio" aria-checked="${selected === i}" onclick="selectOption('${q.id}', ${i}, false)">
          <div class="option-mark" aria-hidden="true"></div>
          <div>${opt}</div>
        </button>`).join('') + '</div>';
  } else if (q.type === 'multi') {
    const selected = state.answers[q.id] || [];
    optionsHTML = '<div class="options" role="group">' + q.options[state.lang].map((opt, i) => `
        <button class="option multi ${selected.includes(i) ? 'selected' : ''}" role="checkbox" aria-checked="${selected.includes(i)}" onclick="selectOption('${q.id}', ${i}, true)">
          <div class="option-mark" aria-hidden="true"></div>
          <div>${opt}</div>
        </button>`).join('') + '</div>';
  } else if (q.type === 'likert') {
    const selected = state.answers[q.id];
    optionsHTML = '<div class="likert" role="radiogroup">' + q.options[state.lang].map((opt, i) => `
        <button class="likert-option ${selected === i ? 'selected' : ''}" role="radio" aria-checked="${selected === i}" onclick="selectOption('${q.id}', ${i}, false)">
          <div class="likert-num" aria-hidden="true">${i + 1}</div>
          <div>${opt}</div>
        </button>`).join('') + '</div>';
  } else if (q.type === 'text') {
    const value = state.answers[q.id] || '';
    optionsHTML = `
      <textarea class="text-input" maxlength="500" placeholder="${state.lang === 'es' ? 'Su respuesta...' : 'Your answer...'}" oninput="setText('${q.id}', this.value)" aria-label="${q.q[state.lang]}">${value}</textarea>
      <div style="text-align:right; color:var(--grey-light); font-size:0.8em; margin-top:6px;"><span id="charCount">${value.length}</span> / 500</div>`;
  }
  let haloDemoHTML = '';
  if (q.showHaloDemo) {
    haloDemoHTML = `<div class="halo-demo">${HALO_DEMO_SVG}<div class="halo-demo-label">${state.lang === 'es' ? 'Tres fenómenos visuales nocturnos que pueden ocurrir tras cirugía ocular' : 'Three nighttime visual phenomena that can occur after eye surgery'}</div></div>`;
  }
  let infoBlockHTML = '';
  if (q.infoBlock) infoBlockHTML = `<div class="info-block">${q.infoBlock[state.lang]}</div>`;
  let urgentMessageHTML = '';
  if (q.urgentOption !== undefined && q.urgentMessage) {
    const selected = state.answers[q.id];
    const isUrgent = (q.type === 'single' && selected === q.urgentOption) ||
      (q.type === 'multi' && Array.isArray(selected) && selected.includes(q.urgentOption));
    if (isUrgent) urgentMessageHTML = `<div class="urgent-message" role="alert">${q.urgentMessage[state.lang]}</div>`;
  }
  const hasAnswer = state.answers[q.id] !== undefined &&
    (q.type !== 'multi' || (Array.isArray(state.answers[q.id]) && state.answers[q.id].length > 0)) &&
    (q.type !== 'text' || q.optional || (state.answers[q.id] && state.answers[q.id].length > 0));
  const canSkip = q.optional;
  const canProceed = hasAnswer || canSkip;
  const isLast = state.currentQuestionIdx === applicableQs.length - 1;
  document.getElementById('main').innerHTML = `
    <div class="question-card">
      <div class="section-tag">${sectionLabel}</div>
      <div class="question-text">${q.q[state.lang]}${optionalLabel}</div>
      ${helperText ? `<div class="question-helper">${helperText}</div>` : ''}
      ${haloDemoHTML}
      ${infoBlockHTML}
      ${optionsHTML}
      ${urgentMessageHTML}
      <div class="btn-row">
        ${state.currentQuestionIdx > 0 ? `<button class="btn btn-secondary" onclick="prevQuestion()">${t.btn_back}</button>` : ''}
        ${isLast ? `
          <button class="btn btn-secondary" ${!canProceed ? 'disabled' : ''} onclick="goToReview()">${t.btn_review}</button>
          <button class="btn btn-primary" ${!canProceed ? 'disabled' : ''} onclick="skipReview()">${t.btn_finish}</button>
        ` : `<button class="btn btn-primary" ${!canProceed ? 'disabled' : ''} onclick="nextQuestion()">${t.btn_next}</button>`}
      </div>
    </div>`;
}

function renderConfirmation() {
  const t = T[state.lang];
  const applicableQs = getApplicableQuestions();
  // Agrupar por sección — UI/UX mejora
  const grouped = { s1: [], s2: [], s3: [], s4: [] };
  applicableQs.forEach(q => { if (grouped[q.section]) grouped[q.section].push(q); });
  let summaryHTML = '';
  ['s1', 's2', 's3', 's4'].forEach(secKey => {
    if (grouped[secKey].length === 0) return;
    summaryHTML += `<div class="confirmation-section">
      <div class="confirmation-section-header">${SECTIONS[secKey][state.lang]}</div>
      <div class="confirmation-summary">`;
    grouped[secKey].forEach(q => {
      const ans = state.answers[q.id];
      let displayValue = '';
      if (q.type === 'single') displayValue = ans !== undefined ? q.options[state.lang][ans] : '—';
      else if (q.type === 'single_dynamic') {
        const opts = q.dynamicOptions(state.answers) || [];
        displayValue = ans !== undefined ? opts[ans] : '—';
      } else if (q.type === 'multi') {
        displayValue = (Array.isArray(ans) && ans.length > 0) ? ans.map(i => q.options[state.lang][i]).join(', ') : '—';
      } else if (q.type === 'likert') {
        displayValue = ans !== undefined ? `${ans + 1}. ${q.options[state.lang][ans]}` : '—';
      } else if (q.type === 'text') {
        displayValue = ans && ans.trim() ? ans : (q.optional ? (state.lang === 'es' ? 'Sin comentarios' : 'No comments') : '—');
      }
      summaryHTML += `<div class="confirmation-item"><div class="confirmation-label">${q.q[state.lang]}</div><div class="confirmation-value">${displayValue}</div></div>`;
    });
    summaryHTML += `</div></div>`;
  });
  document.getElementById('main').innerHTML = `
    <div class="confirmation">
      <h2>${t.confirm_title}</h2>
      <p style="color:var(--grey); margin-top:8px;">${t.confirm_intro}</p>
      ${summaryHTML}
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="goBackFromConfirm()">${t.btn_back}</button>
        <button class="btn btn-primary" onclick="submitQuestionnaire()">${t.btn_submit}</button>
      </div>
    </div>`;
}

function renderOutput() {
  const t = T[state.lang];
  const result = calculateOutput();
  // Mensaje calibrado de Equilibrada para ambos casos (Monofocal Plus y Apthera IC-8)
  const tierMessageMap = {
    esencial: state.lang === 'es' ? 'Sus respuestas sugieren que prioriza la calidad de imagen y acepta usar espejuelos según preferencia.' : 'Your answers suggest you prioritize image quality and accept using glasses by preference.',
    equilibrada: state.lang === 'es' ? 'Sus respuestas sugieren que busca un balance entre calidad de imagen y funcionalidad, con buena visión a múltiples distancias. En la consulta, su clínico determinará la opción específica dentro de este perfil que mejor encaje con la anatomía y necesidades de su caso.' : 'Your answers suggest you seek a balance between image quality and functionality, with good vision at multiple distances. At your consultation, your clinician will determine the specific option within this profile that best fits your case anatomy and needs.',
    completa: state.lang === 'es' ? 'Sus respuestas sugieren que busca independencia funcional de espejuelos en las tres distancias.' : 'Your answers suggest you seek functional independence from glasses at all three distances.'
  };
  document.getElementById('main').innerHTML = `
    <div class="output-screen">
      <div class="output-banner">
        <h2>${t.output_title}</h2>
        <p>${t.output_intro}</p>
      </div>
      <div class="output-section">
        <h3>${t.output_summary_h}</h3>
        <p>${tierMessageMap[result.tierLabel]}</p>
      </div>
      <div class="output-section">
        <h3>${t.output_next_h}</h3>
        <p>${t.output_next_p}</p>
      </div>
      <button class="toggle-clinical" onclick="toggleClinical()" aria-expanded="${state.showClinical}">${state.showClinical ? '▲' : '▼'} ${t.output_clinical_h}</button>
      <div class="clinical-output ${state.showClinical ? 'visible' : ''}">
        <div class="clinical-section" style="background: var(--sand-light);">
          <p style="font-size:0.85em; color:var(--grey); font-style:italic;">${t.output_clinical_p}</p>
        </div>
        <div class="clinical-section">
          <h4>Recomendaciones tentativas</h4>
          <div class="clinical-line"><div class="clinical-label">Vía clínica:</div><div class="clinical-value"><span class="badge badge-via">${result.viaCode}</span> ${result.via}</div></div>
          <div class="clinical-line"><div class="clinical-label">Tier tentativo:</div><div class="clinical-value"><span class="badge badge-tier">${result.tier}</span></div></div>
          ${result.redFlags.length > 0 ? `<div class="clinical-line" style="margin-top:12px;"><div class="clinical-label">Banderas rojas:</div><div class="clinical-value">${result.redFlags.map(f => `<div style="margin-bottom:8px;"><span class="badge badge-red">${f.label}</span><div style="font-size:0.85em; color:#666; margin-top:4px;">${f.detail}</div></div>`).join('')}</div></div>` : ''}
          ${result.yellowFlags.length > 0 ? `<div class="clinical-line" style="margin-top:8px;"><div class="clinical-label">Banderas amarillas:</div><div class="clinical-value">${result.yellowFlags.map(f => `<div style="margin-bottom:8px;"><span class="badge badge-yellow">${f.label}</span><div style="font-size:0.85em; color:#666; margin-top:4px;">${f.detail}</div></div>`).join('')}</div></div>` : ''}
          ${result.greenFlags.length > 0 ? `<div class="clinical-line" style="margin-top:8px;"><div class="clinical-label">Banderas verdes:</div><div class="clinical-value">${result.greenFlags.map(f => `<div style="margin-bottom:8px;"><span class="badge badge-green">${f.label}</span><div style="font-size:0.85em; color:#666; margin-top:4px;">${f.detail}</div></div>`).join('')}</div></div>` : ''}
        </div>
        <div class="clinical-section">
          <h4>Cómo el paciente respondió</h4>
          <div class="clinical-narrative">${result.narrative}</div>
        </div>
        <div class="clinical-section">
          <h4>Reglas algorítmicas aplicadas</h4>
          ${result.appliedRules.map(r => `<div class="rule-trace">${r}</div>`).join('')}
          <div style="margin-top:12px; font-size:0.85em; color:var(--grey);"><strong>Scores tier:</strong> Esencial ${result.tierScores.esencial} · Equilibrada ${result.tierScores.equilibrada} · Completa ${result.tierScores.completa}</div>
        </div>
      </div>
      <div style="padding: 24px; text-align:center; display:flex; flex-wrap:wrap; gap:10px; justify-content:center;">
        <button class="btn btn-secondary" style="min-width:200px;" onclick="downloadSummary()">${state.lang === 'es' ? '📄 Descargar resumen' : '📄 Download summary'}</button>
        <button class="btn btn-secondary" style="min-width:200px;" onclick="shareSummary()">${state.lang === 'es' ? '✉ Compartir / Enviar' : '✉ Share / Send'}</button>
        <button class="btn btn-primary" style="min-width:200px;" onclick="restartDemo()">${state.lang === 'es' ? 'Reiniciar demo' : 'Restart demo'}</button>
      </div>
    </div>`;
}

function buildSummaryText() {
  const result = calculateOutput();
  const applicableQs = getApplicableQuestions();
  const isES = state.lang === 'es';
  let lines = [];
  lines.push(isES ? 'CUESTIONARIO VIXION COMPASS — RESUMEN' : 'VIXION COMPASS QUESTIONNAIRE — SUMMARY');
  lines.push('Instituto de Ojos de Puerto Rico · iopr.com');
  lines.push(isES ? 'Fecha: ' + new Date().toLocaleDateString('es-PR') : 'Date: ' + new Date().toLocaleDateString('en-US'));
  lines.push('');
  lines.push(isES ? '=== SUS RESPUESTAS ===' : '=== YOUR ANSWERS ===');
  lines.push('');
  applicableQs.forEach(q => {
    const ans = state.answers[q.id];
    let displayValue = '—';
    if (q.type === 'single') displayValue = ans !== undefined ? q.options[state.lang][ans] : '—';
    else if (q.type === 'single_dynamic') {
      const opts = q.dynamicOptions(state.answers) || [];
      displayValue = ans !== undefined ? opts[ans] : '—';
    } else if (q.type === 'multi') {
      displayValue = (Array.isArray(ans) && ans.length > 0) ? ans.map(i => q.options[state.lang][i]).join('; ') : '—';
    } else if (q.type === 'likert') {
      displayValue = ans !== undefined ? (ans + 1) + '. ' + q.options[state.lang][ans] : '—';
    } else if (q.type === 'text') {
      displayValue = ans && ans.trim() ? ans : (isES ? 'Sin comentarios' : 'No comments');
    }
    lines.push('• ' + q.q[state.lang]);
    lines.push('  ' + displayValue);
    lines.push('');
  });
  lines.push(isES ? '=== ORIENTACIÓN PRELIMINAR ===' : '=== PRELIMINARY GUIDANCE ===');
  lines.push('');
  lines.push(isES ? 'Su clínico revisará estas respuestas antes de su consulta. En la cita, le orientará sobre cuál podría ser la mejor opción para su caso específico, basándose en lo que usted compartió y en los exámenes clínicos.' : 'Your clinician will review these answers before your visit. At the appointment, they will guide you on what might be the best option for your specific case, based on what you shared and the clinical exams.');
  lines.push('');
  lines.push(isES ? 'Lleve este resumen a su consulta para facilitar la conversación.' : 'Bring this summary to your appointment to facilitate the conversation.');
  return lines.join('\n');
}

function downloadSummary() {
  const text = buildSummaryText();
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const dateStr = new Date().toISOString().slice(0, 10);
  a.download = 'VixiOn_Compass_Resumen_' + dateStr + '.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 100);
}

function shareSummary() {
  const text = buildSummaryText();
  const isES = state.lang === 'es';
  if (navigator.share) {
    navigator.share({ title: isES ? 'Mi resumen VixiOn Compass' : 'My VixiOn Compass Summary', text: text }).catch(err => copyToClipboard(text));
  } else copyToClipboard(text);
}

function copyToClipboard(text) {
  const isES = state.lang === 'es';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => { alert(isES ? '✓ Resumen copiado al portapapeles. Puede pegarlo en un correo o mensaje.' : '✓ Summary copied to clipboard. You can paste it in an email or message.'); }).catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
}

function fallbackCopy(text) {
  const isES = state.lang === 'es';
  const textarea = document.createElement('textarea');
  textarea.value = text; textarea.style.position = 'fixed'; textarea.style.opacity = '0';
  document.body.appendChild(textarea); textarea.select();
  try { document.execCommand('copy'); alert(isES ? '✓ Resumen copiado al portapapeles.' : '✓ Summary copied to clipboard.'); }
  catch (e) { alert(isES ? 'No se pudo copiar automáticamente. Use el botón de descargar.' : 'Could not copy automatically. Use the download button.'); }
  document.body.removeChild(textarea);
}

function startQuestionnaire() { state.currentScreen = 'questions'; state.currentQuestionIdx = 0; render(); }

function selectOption(qId, value, isMulti) {
  if (isMulti) {
    if (!Array.isArray(state.answers[qId])) state.answers[qId] = [];
    const idx = state.answers[qId].indexOf(value);
    if (qId === 'q14_conditions') {
      if (value === 10 || value === 11) state.answers[qId] = state.answers[qId].includes(value) ? [] : [value];
      else { state.answers[qId] = state.answers[qId].filter(v => v !== 10 && v !== 11); if (idx === -1) state.answers[qId].push(value); else state.answers[qId].splice(idx, 1); }
    } else if (qId === 'q14_5_meds') {
      if (value === 5 || value === 6) state.answers[qId] = state.answers[qId].includes(value) ? [] : [value];
      else { state.answers[qId] = state.answers[qId].filter(v => v !== 5 && v !== 6); if (idx === -1) state.answers[qId].push(value); else state.answers[qId].splice(idx, 1); }
    } else if (qId === 'q3_1_magnitude') {
      if (value === 5) state.answers[qId] = state.answers[qId].includes(5) ? [] : [5];
      else { state.answers[qId] = state.answers[qId].filter(v => v !== 5); if (idx === -1) state.answers[qId].push(value); else state.answers[qId].splice(idx, 1); }
    } else if (qId === 'q4_activities') {
      if (value === 7) state.answers[qId] = state.answers[qId].includes(7) ? [] : [7];
      else { state.answers[qId] = state.answers[qId].filter(v => v !== 7); if (idx === -1) state.answers[qId].push(value); else state.answers[qId].splice(idx, 1); }
    } else { if (idx === -1) state.answers[qId].push(value); else state.answers[qId].splice(idx, 1); }
  } else { state.answers[qId] = value; }
  saveProgress();
  render();
}

function setText(qId, value) {
  state.answers[qId] = value;
  const cc = document.getElementById('charCount');
  if (cc) cc.textContent = value.length;
  saveProgress();
}

function nextQuestion() {
  const applicableQs = getApplicableQuestions();
  if (state.currentQuestionIdx < applicableQs.length - 1) {
    state.currentQuestionIdx++; saveProgress(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    state.currentScreen = 'confirm'; saveProgress(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function goToReview() { state.currentScreen = 'confirm'; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function skipReview() { state.currentScreen = 'output'; state.showClinical = false; clearProgress(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function prevQuestion() { if (state.currentQuestionIdx > 0) { state.currentQuestionIdx--; saveProgress(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }
function goBackFromConfirm() { state.currentScreen = 'questions'; const applicableQs = getApplicableQuestions(); state.currentQuestionIdx = applicableQs.length - 1; render(); }
function submitQuestionnaire() { state.currentScreen = 'output'; state.showClinical = false; clearProgress(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function toggleClinical() { state.showClinical = !state.showClinical; render(); }
function restartDemo() {
  state = { currentScreen: 'welcome', currentQuestionIdx: 0, answers: {}, lang: state.lang, sizeLevel: state.sizeLevel, showClinical: false };
  render();
}
function toggleLang() {
  state.lang = state.lang === 'es' ? 'en' : 'es';
  document.getElementById('langBtn').textContent = state.lang === 'es' ? 'EN' : 'ES';
  document.documentElement.lang = state.lang;
  render();
}
function cycleSize() {
  state.sizeLevel = (state.sizeLevel + 1) % 4;
  document.body.className = SIZES[state.sizeLevel];
  document.getElementById('sizeBtn').classList.toggle('active', state.sizeLevel > 0);
  document.getElementById('sizeBtn').textContent = state.sizeLevel === 0 ? 'A+' : 'A+' + state.sizeLevel;
}
render();
</script>
</body>
</html>
